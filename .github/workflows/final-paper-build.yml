name: Final paper build

on:
  push:
    branches:
      - main
    paths-ignore:
      - operator-archeology.pdf
      - .github/workflows/final-paper-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra
      - name: Build PDF
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error operator-archeology.tex
      - name: Check layout warnings
        run: grep -E "Overfull|Underfull|LaTeX Warning|Undefined" operator-archeology.log || true
      - name: Commit rebuilt PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operator-archeology.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild Operator Archaeology PDF"
            git push
          fi
